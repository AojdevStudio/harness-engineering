name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: [self-hosted, linux, dev-substrate]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run verify
